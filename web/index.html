<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Password Remover</title>
  <style>
    body { font: 16px system-ui; max-width: 36rem; margin: 4rem auto; padding: 0 1rem; }
    form { display: grid; gap: 1rem; }
    input, button { font: inherit; padding: .7rem; }
    #status { min-height: 1.5rem; }
  </style>
</head>
<body>
  <h1>PDF Password Remover</h1>
  <p>The PDF and password stay inside this browser tab.</p>
  <form>
    <label>Encrypted PDF <input id="pdf" type="file" accept="application/pdf,.pdf" required></label>
    <label>Password <input id="password" type="password" autocomplete="off" required></label>
    <button type="submit">Decrypt and download</button>
    <output id="status" aria-live="polite"></output>
  </form>
  <script type="module" src="./app.js"></script>
</body>
</html>
